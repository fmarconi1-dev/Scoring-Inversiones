name: Actualizar tablero de scoring

# Corre en la nube de GitHub, sin depender de tu PC ni de Claude.
on:
  schedule:
    # 22:00 UTC de lunes a viernes (~después del cierre del mercado US, todo el año).
    - cron: "0 22 * * 1-5"
  workflow_dispatch:        # permite dispararlo manualmente desde la pestaña Actions
  push:
    branches: [main]        # re-publica el tablero al cambiar el código

permissions:
  contents: write           # para commitear los datos actualizados
  pages: write              # para publicar en GitHub Pages
  id-token: write

concurrency:
  group: tablero
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr batch EOD (genera ui/data.json y ui/data.js)
        run: python data/build_snapshot.py

      - name: Commitear datos si cambiaron
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ui/data.json ui/data.js
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "chore: actualizar datos EOD [skip ci]"
            git push
          fi

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir el tablero (carpeta ui) como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
